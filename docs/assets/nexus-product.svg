  <rect x="758" y="32" width="445" height="44" rx="17" fill="url(#brand)"/>
  <text x="776" y="59" fill="#fff" font-family="Inter, ui-sans-serif, system-ui" font-size="16">What is the virtuous cycle of pricing that Alex describes?</text>

  <g filter="url(#shadow)">
    <rect x="466" y="96" width="628" height="519" rx="18" fill="#18181d"/>
  </g>
  <g fill="#ededf2" font-family="Inter, ui-sans-serif, system-ui" font-size="16">
    <text x="483" y="127">Alex describes the virtuous cycle of pricing (page 48 of his $100M Offers book)</text>
    <text x="483" y="153">as: raise your price, which increases the customer's emotional investment and</text>
    <text x="483" y="179">perceived value, increases the results, and decreases how demanding the</text>
    <text x="483" y="205">customer is — and you get more money to actually deliver</text>
    <text x="483" y="231">In another telling, the more you charge, the better the customer you attract,</text>
    <text x="483" y="257">the more you can over-deliver for them, the more profit you make, the better talent</text>
    <text x="483" y="283">you can bring on, and the more you can over-deliver again — a cycle of going</text>
    <text x="483" y="309">upmarket rather than competing down. He also frames a talent-based version:</text>
    <text x="483" y="335">good work generates more demand, more demand exceeds supply so you raise prices,</text>
    <text x="483" y="361">the extra cash buys better talent, better work builds reputation, which raises price</text>
    <text x="483" y="387">again — so talent and price should both keep climbing.</text>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui" font-size="12" font-weight="650">
    <rect x="915" y="188" width="24" height="22" rx="6" fill="#2b2b48"/><text x="924" y="203" fill="#a5b4fc">1</text>
    <rect x="613" y="292" width="24" height="22" rx="6" fill="#2b2b48"/><text x="622" y="307" fill="#a5b4fc">2</text>
    <rect x="888" y="370" width="24" height="22" rx="6" fill="#2b2b48"/><text x="897" y="385" fill="#a5b4fc">3</text>
  </g>

